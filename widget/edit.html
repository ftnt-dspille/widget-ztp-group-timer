<!-- EDIT template -- SOAR opens this as a $uibModal, so the template MUST
     carry its own modal shell (modal-header/body/footer). A bare div with no
     footer renders unstyled: without .modal-body the platform's form styles
     never reach the rows and every label draws as a full-width band with no
     Save/Cancel. Bind to object properties (config.X), never bare words --
     the modal is a child scope and a bare ng-model write would shadow the
     parent. See ztpRunReport/widget/edit.html for the same shell. -->
<form data-ng-submit="save()" class="noMargin" name="editZtpGroupTimerForm" novalidate
      data-testid="ztp-group-timer-edit-form">
  <div class="modal-header">
    <h3 class="modal-title col-md-9">ZTP Group Timer -- Settings</h3>
    <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal"
            data-testid="cfg-close" aria-label="Close" id="close-edit-widget-form-btn">
      <div aria-hidden="true" class="version-button">+</div>
    </button>
  </div>

  <div class="modal-body">
    <div class="form-group">
      <label for="ztp-group-timer-title" class="control-label">Title</label>
      <input id="ztp-group-timer-title" name="title" type="text" class="form-control"
             data-ng-model="config.title" data-testid="ztp-group-timer-cfg-title">
    </div>

    <div class="form-group">
      <label class="control-label">Theme</label>
      <div class="ztp-gt-theme-picker">
        <label class="ztp-gt-theme-opt" data-ng-repeat="t in THEMES track by t.id"
               data-ng-class="{on: config.theme === t.id}">
          <input type="radio" name="theme" data-ng-model="config.theme" data-ng-value="t.id"
                 data-testid="ztp-group-timer-cfg-theme-{{ t.id }}" />
          {{ t.label }}
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="ztp-group-timer-refresh" class="control-label">Refresh interval while running (seconds)</label>
      <input id="ztp-group-timer-refresh" name="refreshSecs" type="number" min="1"
             class="form-control" data-ng-model="config.refreshSecs"
             data-testid="ztp-group-timer-cfg-refresh">
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-default" data-ng-click="cancel()"
            data-testid="cfg-cancel">Cancel</button>
    <button type="submit" class="btn btn-primary" data-testid="cfg-save">Save</button>
  </div>
</form>

<style>
.ztp-gt-theme-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.ztp-gt-theme-opt {
  padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(127,127,127,.4);
  cursor: pointer; font-weight: normal;
}
.ztp-gt-theme-opt.on { border-color: #34ca46; background: rgba(52,202,70,.12); }
.ztp-gt-theme-opt input { margin-right: 6px; }
</style>
